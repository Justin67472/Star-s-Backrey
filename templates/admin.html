<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Star's Bakery</title>
  <style>
    :root { --cream:#fffaf4; --pink:#f4c7d5; --rose:#d88c9e; --brown:#5f3b33; --dark:#2b1d1a; }
    body { margin:0; font-family:Inter, Arial, sans-serif; background:linear-gradient(135deg,#fffaf4,#ffeef2); color:var(--dark); }
    .frame { max-width:1100px; margin:0 auto; padding:28px; }
    .card { background:white; border-radius:24px; box-shadow:0 18px 45px rgba(95,59,51,.12); padding:24px; margin-bottom:20px; }
    h1,h2,h3 { color:var(--brown); }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    .stat { background:var(--cream); padding:16px; border-radius:16px; }
    .btn { display:inline-block; padding:10px 14px; background:linear-gradient(135deg,var(--rose),var(--pink)); color:white; border-radius:999px; text-decoration:none; margin-top:10px; }
    @media (max-width:800px){ .grid{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <h1>Admin Dashboard</h1>
      <p>Manage products, package offers, and bakery orders from one place.</p>
      <a class="btn" href="{{ url_for('user.home') }}">Return to storefront</a>
    </div>
    <div class="card">
      <div class="grid">
        <div class="stat"><h3>Orders</h3><p>24 active</p></div>
        <div class="stat"><h3>Products</h3><p>18 listed</p></div>
        <div class="stat"><h3>Packages</h3><p>4 live offers</p></div>
      </div>
    </div>
    <div class="card">
      <h2>Quick actions</h2>
      <ul>
        <li>Add new item</li>
        <li>Update pricing</li>
        <li>Approve order</li>
      </ul>
    </div>
    <div class="card">
      <h2>Category product count</h2>
      <canvas id="categoryChart" width="600" height="340"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    async function loadCategoryChart() {
      const response = await fetch('/chart-data');
      if (!response.ok) {
        console.error('Failed to load chart data');
        return;
      }

      const data = await response.json();
      const labels = data.categories.map(item => item.category);
      const values = data.categories.map(item => item.value);

      const ctx = document.getElementById('categoryChart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: 'Products per category',
            data: values,
            backgroundColor: 'rgba(216, 140, 158, 0.8)',
            borderColor: 'rgba(216, 140, 158, 1)',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: true,
              ticks: { precision: 0 }
            }
          }
        }
      });
    }

    loadCategoryChart();
  </script>
</body>
</html>
