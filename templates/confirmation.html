<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Confirmation - Star's Bakery</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f9f9f9; }
    .confirmation-container {
      width: 500px; margin: 100px auto; padding: 30px;
      background: #fff; border-radius: 10px; text-align: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    h1 { color: #4CAF50; }
    p { color: #555; font-size: 16px; }
    .btn {
      display: inline-block; margin-top: 20px; padding: 12px 20px;
      background: #ff4081; color: #fff; text-decoration: none;
      border-radius: 5px; font-size: 16px;
    }
    .btn:hover { background: #e73370; }
  </style>
</head>
<body>
  <div class="confirmation-container">
    <h1>🎉 Order Confirmed!</h1>
    <p>Thank you for shopping at Star's Bakery.</p>
    <p>Your payment has been processed successfully.</p>
    <p>We’ll deliver your items shortly to the address you provided.</p>
    <a href="starsbakery.html" class="btn">Return to Home</a>
  </div>
</body>
</html>
