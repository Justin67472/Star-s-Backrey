<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muffins · Star's Bakery</title>

  <!-- Google Font & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* ----- RESET & THEME (cream · black · orange) ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #fcf7f0;
      color: #1e1e1e;
      line-height: 1.5;
      padding: 1rem;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    :root {
      --orange: #e87a2d;
      --orange-light: #f59c4a;
      --orange-dark: #c05f1a;
      --black: #1e1e1e;
      --cream: #fcf7f0;
      --cream-dark: #f2eadc;
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.04);
      --radius: 24px;
      --transition: 0.25s ease;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: var(--cream);
      border-radius: 40px;
      padding: 1.5rem 2rem 1rem;
      box-shadow: var(--shadow);
    }

    /* ----- HEADER ----- */
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem 2rem;
      padding: 0.5rem 0 1.5rem 0;
      border-bottom: 2px solid var(--cream-dark);
    }

    .logo img {
      height: 60px;
      width: auto;
      border-radius: 40px;
      box-shadow: 0 4px 10px rgba(232, 122, 45, 0.15);
    }

    .main-nav ul {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 1rem;
      list-style: none;
      font-weight: 500;
    }

    .main-nav a {
      padding: 0.4rem 0.9rem;
      border-radius: 60px;
      background: transparent;
      color: var(--black);
      font-size: 0.95rem;
      transition: var(--transition);
      letter-spacing: -0.01em;
    }

    .main-nav a:hover,
    .main-nav a.active {
      background: var(--orange);
      color: white;
      box-shadow: 0 4px 10px rgba(232, 122, 45, 0.3);
      transform: scale(1.02);
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-size: 1.6rem;
    }

    .header-icons a,
    .header-icons span {
      color: var(--black);
      transition: var(--transition);
    }

    .header-icons a:hover {
      color: var(--orange);
      transform: scale(1.1);
    }

    #profileIcon {
      background: var(--cream-dark);
      padding: 0.3rem 0.8rem;
      border-radius: 60px;
      font-size: 1.2rem;
      cursor: default;
    }

    /* ----- PAGE TITLE (animated) ----- */
    .page-title {
      text-align: center;
      margin: 2rem 0 2.2rem;
    }

    .page-title h1 {
      font-size: 2.8rem;
      font-weight: 700;
      background: linear-gradient(145deg, var(--orange-dark), var(--orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
      display: inline-block;
      padding: 0 1.5rem;
      border-radius: 80px;
      background-color: var(--cream);
      box-shadow: 0 4px 12px rgba(232, 122, 45, 0.1);
    }

    .page-title p {
      font-size: 1.15rem;
      color: #3d342e;
      margin-top: 0.3rem;
      font-weight: 400;
    }

    /* ----- PRODUCT GRID ----- */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 2rem 1.5rem;
      margin: 1.8rem 0 2.5rem;
    }

    .product-card {
      background: white;
      border-radius: var(--radius);
      padding: 1.2rem 1rem 1.5rem;
      box-shadow: var(--shadow);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 1px solid rgba(232, 122, 45, 0.06);
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 24px 40px rgba(232, 122, 45, 0.12);
      border-color: var(--orange-light);
    }

    .product-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 18px;
      background: var(--cream-dark);
      margin-bottom: 0.8rem;
      transition: var(--transition);
    }

    .product-card:hover img {
      transform: scale(1.02);
    }

    .product-card h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--black);
      margin: 0.3rem 0 0.2rem;
      line-height: 1.3;
      min-height: 2.6rem;
    }

    .product-card .price {
      font-weight: 700;
      color: var(--orange-dark);
      background: rgba(232, 122, 45, 0.08);
      padding: 0.2rem 1.4rem;
      border-radius: 60px;
      font-size: 0.95rem;
      margin: 0.4rem 0 0.8rem;
      display: inline-block;
    }

    .add-cart-btn {
      background: var(--orange);
      border: none;
      padding: 0.6rem 1.6rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.9rem;
      color: white;
      cursor: pointer;
      transition: var(--transition);
      width: 100%;
      max-width: 180px;
      box-shadow: 0 4px 10px rgba(232, 122, 45, 0.2);
    }

    .add-cart-btn:hover {
      background: var(--orange-dark);
      transform: scale(1.03);
      box-shadow: 0 6px 16px rgba(232, 122, 45, 0.3);
    }

    /* ----- PAGINATION ----- */
    .pagination {
      margin: 1.8rem 0 2.2rem;
      display: flex;
      justify-content: center;
    }

    .pagination-buttons {
      display: flex;
      align-items: center;
      gap: 1.8rem;
      background: white;
      padding: 0.4rem 1.2rem;
      border-radius: 60px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(232, 122, 45, 0.08);
    }

    .pagination-btn {
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--black);
      cursor: pointer;
      padding: 0.4rem 0.8rem;
      border-radius: 40px;
      transition: var(--transition);
    }

    .pagination-btn:hover {
      background: var(--orange);
      color: white;
      box-shadow: 0 4px 10px rgba(232, 122, 45, 0.25);
    }

    .pagination-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .pagination-btn:disabled:hover {
      background: transparent;
      color: var(--black);
      box-shadow: none;
    }

    .pagination-btn .muffin-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--cream-dark);
    }

    .page-number {
      font-weight: 600;
      color: var(--orange-dark);
      background: rgba(232, 122, 45, 0.06);
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-size: 0.9rem;
    }

    /* ----- FOOTER ----- */
    footer {
      margin-top: 2.5rem;
      padding: 1.8rem 0 0.8rem;
      border-top: 2px solid var(--cream-dark);
      text-align: center;
      font-size: 0.9rem;
      color: #4a3f38;
      letter-spacing: 0.02em;
    }

    footer p {
      background: var(--cream);
      display: inline-block;
      padding: 0.2rem 2rem;
      border-radius: 60px;
    }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 820px) {
      .container {
        padding: 0.8rem 1rem;
      }
      header {
        flex-direction: column;
        align-items: stretch;
        gap: 0.8rem;
      }
      .logo {
        text-align: center;
      }
      .logo img {
        height: 70px;
        margin: 0 auto;
      }
      .main-nav ul {
        justify-content: center;
        gap: 0.2rem 0.6rem;
      }
      .main-nav a {
        font-size: 0.8rem;
        padding: 0.3rem 0.7rem;
      }
      .header-icons {
        justify-content: center;
        font-size: 1.8rem;
        gap: 2rem;
      }
      .page-title h1 {
        font-size: 2.2rem;
      }
      .product-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 1.5rem;
      }
      .product-card {
        padding: 0.8rem 0.6rem 1rem;
      }
      .product-card h3 {
        font-size: 0.85rem;
        min-height: 2.2rem;
      }
      .pagination-buttons {
        gap: 0.8rem;
        padding: 0.3rem 0.8rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .pagination-btn {
        font-size: 0.8rem;
        padding: 0.2rem 0.6rem;
      }
      .pagination-btn .muffin-icon {
        width: 22px;
        height: 22px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 0.4rem;
      }
      .container {
        padding: 0.4rem 0.6rem;
      }
      .main-nav ul {
        gap: 0.15rem 0.3rem;
      }
      .main-nav a {
        font-size: 0.7rem;
        padding: 0.2rem 0.5rem;
      }
      .page-title h1 {
        font-size: 1.8rem;
      }
      .product-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
      }
      .product-card h3 {
        font-size: 0.75rem;
        min-height: 2rem;
      }
      .product-card .price {
        font-size: 0.8rem;
        padding: 0.1rem 1rem;
      }
      .add-cart-btn {
        font-size: 0.75rem;
        padding: 0.4rem 0.8rem;
        max-width: 140px;
      }
      .pagination-buttons {
        gap: 0.5rem;
        padding: 0.2rem 0.6rem;
      }
      .pagination-btn {
        font-size: 0.7rem;
      }
      .pagination-btn .muffin-icon {
        width: 18px;
        height: 18px;
      }
      .page-number {
        font-size: 0.75rem;
        padding: 0.1rem 0.6rem;
      }
      .header-icons {
        font-size: 1.4rem;
        gap: 1.2rem;
      }
      .logo img {
        height: 55px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <header>
    <div class="logo">
      <a href="{{ url_for('user.homepage') }}">
        <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Star's Bakery Logo" />
      </a>
    </div>

    <nav class="main-nav">
      <ul>
        <li><a href="{{ url_for('user.muffins') }}" class="active">Muffins</a></li>
        <li><a href="{{ url_for('user.doughnuts') }}">Doughnuts</a></li>
        <li><a href="{{ url_for('user.pancakes') }}">Pancakes</a></li>
        <li><a href="{{ url_for('user.cinnamonroll') }}">Cinnamon Rolls</a></li>
        <li><a href="{{ url_for('user.cookies') }}">Cookies</a></li>
        <li><a href="{{ url_for('user.tincakes') }}">Tin Cakes</a></li>
        <li><a href="{{ url_for('user.fruitjuices') }}">Fruit Juices</a></li>
        <li><a href="{{ url_for('user.packages') }}">Packages</a></li>
        <li><a href="{{ url_for('user.aboutme') }}">About Me</a></li>
      </ul>
    </nav>

    <div class="header-icons">
      <a href="{{ url_for('user.cart') }}" class="cart" aria-label="Cart"><i class="fas fa-shopping-bag"></i></a>
      <span id="profileIcon"><i class="fas fa-user-circle"></i></span>
    </div>
  </header>

  <!-- PAGE TITLE (animated) -->
  <section class="page-title">
    <h1 id="categoryTitle">Muffins</h1>
    <p id="categorySubtitle">From My Oven to Your Table.</p>
  </section>

  <!-- PRODUCT GRID (randomised, 9 per page) -->
  <section class="product-grid" id="productGrid"></section>

  <!-- PAGINATION -->
  <section class="pagination">
    <div class="pagination-buttons" id="paginationControls">
      <button class="pagination-btn back-btn" id="prevPage">
        <img src="{{ url_for('static', filename='images/cutemuffin.png') }}" alt="Back Icon" class="muffin-icon" />
        ← Back
      </button>
      <span class="page-number" id="pageIndicator">Page 1 of 1</span>
      <button class="pagination-btn next-btn" id="nextPage">
        Next →
        <img src="{{ url_for('static', filename='images/muffincutey.png') }}" alt="Next Icon" class="muffin-icon" />
      </button>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 Star's Bakery. All Rights Reserved.</p>
  </footer>

</div>

<script>
  // ----- PRODUCT DATA (combined from all 3 pages) -----
  const allProducts = [
    // Page 1 (10 items)
    { name: "Vanilla Choco Chip", price: 15, image: "vanilla.jpg" },
    { name: "ChocoVan (With Vanilla Filling)", price: 25, image: "chocovanfill.jpg" },
    { name: "Double Choco (With Jam Filling)", price: 25, image: "doublechocofill.jpg" },
    { name: "Vanilla Apple Pie (With Apple Sauce Filling)", price: 15, image: "vanillaapplepie.jpg" },
    { name: "Tutty Fruity (With Fruit Chunks)", price: 15, image: "tuttyfruity.jpg" },
    { name: "Choco Oreo Crunch (With Oreo Filling)", price: 15, image: "chocooreocrunch.jpg" },
    { name: "Red Velvet Crunch (With Crushed Oreos)", price: 15, image: "redvelvetcrunch.jpg" },
    { name: "Lemon Delight", price: 15, image: "lemondelight.png" },
    { name: "Cinnamon Roll", price: 15, image: "cinnamonroll.png" },
    { name: "Biscoff", price: 15, image: "biscoff.png" },
    // Page 2 (10 items)
    { name: "Cotton Candy", price: 15, image: "cottoncandy.png" },
    { name: "Raspberry Velvet (With White Chocolate Drizzle)", price: 25, image: "raspberryvelvet.png" },
    { name: "Cherry Cheesecake (With Cream Cheese and Cherry Compote)", price: 25, image: "cherrycheesecake.png" },
    { name: "Hazelnut Heaven (With Nutella Frosting and Roasted Hazelnuts)", price: 15, image: "hazelnutheaven.png" },
    { name: "Blueberry Dream (With Blueberry Chunks)", price: 15, image: "blueberrydream.png" },
    { name: "Mint ChocoChip (With Mint Frosting and Chocolate Chips)", price: 15, image: "mintchocochip.png" },
    { name: "Tiramisu Temptation (With Coffee Frosting)", price: 15, image: "tiramisutemptation.png" },
    { name: "Coconut Cloud (With Coconut Frosting and Shavings)", price: 15, image: "coconutcloud.png" },
    { name: "Choco Lava", price: 15, image: "chocolava.png" },
    { name: "Banana Bread", price: 15, image: "bananabread.png" },
    // Page 3 (10 items)
    { name: "Carrot Cake", price: 15, image: "carrotcake.png" },
    { name: "Salted Caramel", price: 25, image: "saltedcaramell.png" },
    { name: "Banana Pudding", price: 25, image: "bananapudding.png" },
    { name: "Mocha Madness (With Coffee-Chocolate Frosting)", price: 15, image: "mochamadness.png" },
    { name: "Black Forest Charm (With Cherry Filling and Whipping Cream)", price: 15, image: "blackforestcharm.png" },
    { name: "Orange Creamsicle (With Orange Flavored Frosting)", price: 15, image: "orangecreamiscle.png" },
    { name: "Toffee Crunch (With Toffee Bits)", price: 15, image: "toffeecrunch.png" },
    { name: "Red Velvet Royale (With Cream Cheese Frosting)", price: 15, image: "redvelvetroyale.png" },
    { name: "Regular Chocolate Chip (With Whip Cream)", price: 15, image: "regularchocochip.png" },
    { name: "Matcha Magic (With Green Tea Frosting and White Chocolate Drizzle)", price: 15, image: "matchamagic.png" }
  ];

  // ----- SHUFFLE (Fisher-Yates) -----
  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Shuffle once on page load
  const shuffledProducts = shuffleArray(allProducts);

  // Pagination settings
  const itemsPerPage = 9;
  let currentPage = 1;
  const totalPages = Math.ceil(shuffledProducts.length / itemsPerPage);

  // ----- RENDER PRODUCTS -----
  function renderPage(page) {
    const grid = document.getElementById('productGrid');
    const start = (page - 1) * itemsPerPage;
    const end = start + itemsPerPage;
    const pageItems = shuffledProducts.slice(start, end);

    grid.innerHTML = pageItems.map((p, idx) => {
      const imgPath = "{{ url_for('static', filename='images/') }}" + p.image;
      return `
        <div class="product-card">
          <img src="${imgPath}" alt="${p.name}" onerror="this.src='{{ url_for('static', filename='images/cutemuffin.png') }}'" />
          <h3>${p.name}</h3>
          <p class="price">GHS ${p.price}</p>
          <button class="add-cart-btn" onclick="addToCart('${p.name.replace(/'/g, "\\'")}', ${p.price}, '${imgPath}')">
            Add to Cart
          </button>
        </div>
      `;
    }).join('');

    document.getElementById('pageIndicator').textContent = `Page ${page} of ${totalPages}`;
    updateButtons();
  }

  // ----- ADD TO CART -----
  function addToCart(name, price, image) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    const existing = cart.find(item => item.name === name);
    if (existing) {
      existing.quantity += 1;
    } else {
      cart.push({ name, price, image, quantity: 1 });
    }
    localStorage.setItem('cart', JSON.stringify(cart));
    window.location.href = "{{ url_for('user.cart') }}";
  }

  // ----- PAGINATION CONTROLS -----
  function updateButtons() {
    document.getElementById('prevPage').disabled = (currentPage === 1);
    document.getElementById('nextPage').disabled = (currentPage === totalPages);
  }

  document.getElementById('prevPage').addEventListener('click', function() {
    if (currentPage > 1) {
      currentPage--;
      renderPage(currentPage);
    }
  });

  document.getElementById('nextPage').addEventListener('click', function() {
    if (currentPage < totalPages) {
      currentPage++;
      renderPage(currentPage);
    }
  });

  // ----- PROFILE ICON -----
  document.getElementById('profileIcon')?.addEventListener('click', function() {
    alert('👤 Profile — signed in as guest');
  });

  // ----- ANIMATED TITLE -----
  const title = document.getElementById('categoryTitle');
  const subtitle = document.getElementById('categorySubtitle');

  const titleWords = [
    "Muffin Mastery",
    "Baked Perfection",
    "Artisan Muffins",
    "Elevated Indulgence",
    "Daily Muffin Ritual"
  ];
  const subtitleWords = [
    "Fresh Ingredients, Wholesome Bakes.",
    "Cure Your Muffin Cravings.",
    "Perfect for Mornings & Breaks.",
    "Fresh • Moist • Irresistible.",
    "For Every Muffin Lover."
  ];

  let idx = 0;
  setInterval(() => {
    idx = (idx + 1) % titleWords.length;
    if (title && subtitle) {
      title.textContent = titleWords[idx];
      subtitle.textContent = subtitleWords[idx];
    }
  }, 2500);

  // ----- INITIAL RENDER -----
  renderPage(currentPage);
</script>

</body>
</html>
