<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - Star's Bakery</title>

  <!-- Google Font & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* ----- RESET & THEME (cream · black · orange) ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #fcf7f0;
      color: #1e1e1e;
      line-height: 1.5;
      padding: 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    :root {
      --orange: #e87a2d;
      --orange-light: #f59c4a;
      --orange-dark: #c05f1a;
      --black: #1e1e1e;
      --cream: #fcf7f0;
      --cream-dark: #f2eadc;
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.04);
      --radius: 24px;
      --transition: 0.25s ease;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: var(--cream);
      border-radius: 40px;
      padding: 1.5rem 2rem 1rem;
      box-shadow: var(--shadow);
      flex: 1;
    }

    /* ----- HEADER ----- */
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem 2rem;
      padding: 0.5rem 0 1.5rem 0;
      border-bottom: 2px solid var(--cream-dark);
    }

    .logo img {
      height: 60px;
      width: auto;
      border-radius: 40px;
      box-shadow: 0 4px 10px rgba(232, 122, 45, 0.15);
    }

    .main-nav ul {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 1rem;
      list-style: none;
      font-weight: 500;
    }

    .main-nav a {
      padding: 0.4rem 0.9rem;
      border-radius: 60px;
      background: transparent;
      color: var(--black);
      font-size: 0.95rem;
      transition: var(--transition);
      letter-spacing: -0.01em;
    }

    .main-nav a:hover {
      background: var(--orange);
      color: white;
      box-shadow: 0 4px 10px rgba(232, 122, 45, 0.3);
      transform: scale(1.02);
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-size: 1.6rem;
    }

    .header-icons a,
    .header-icons span {
      color: var(--black);
      transition: var(--transition);
    }

    .header-icons a:hover {
      color: var(--orange);
      transform: scale(1.1);
    }

    #profileIcon {
      background: var(--cream-dark);
      padding: 0.3rem 0.8rem;
      border-radius: 60px;
      font-size: 1.2rem;
      cursor: default;
    }

    #cart-count {
      background: var(--orange);
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.1rem 0.5rem;
      border-radius: 60px;
      margin-left: 0.2rem;
    }

    /* ----- CART PAGE ----- */
    .cart-page {
      padding: 2rem 0;
    }

    .cart-title {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--orange-dark);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .cart-container {
      background: white;
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      min-height: 200px;
      border: 1px solid rgba(232, 122, 45, 0.08);
    }

    .cart-empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--gray-500);
    }

    .cart-empty i {
      font-size: 3rem;
      color: var(--orange-light);
      margin-bottom: 1rem;
    }

    .cart-empty h3 {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--black);
    }

    .cart-empty p {
      color: #737373;
      margin-top: 0.3rem;
    }

    .cart-empty .shop-link {
      display: inline-block;
      margin-top: 1.2rem;
      padding: 0.6rem 2rem;
      background: var(--orange);
      color: white;
      border-radius: 60px;
      font-weight: 600;
      transition: var(--transition);
    }

    .cart-empty .shop-link:hover {
      background: var(--orange-dark);
      transform: scale(1.03);
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      padding: 1rem 0.5rem;
      border-bottom: 1px solid var(--cream-dark);
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 14px;
      background: var(--cream-dark);
      flex-shrink: 0;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-info h4 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--black);
    }

    .cart-item-info .item-price {
      color: var(--orange-dark);
      font-weight: 700;
      font-size: 0.9rem;
      margin-top: 0.2rem;
    }

    .cart-item-actions {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .cart-item-actions button {
      background: var(--cream-dark);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-item-actions button:hover {
      background: var(--orange);
      color: white;
    }

    .cart-item-actions .qty {
      font-weight: 700;
      min-width: 24px;
      text-align: center;
    }

    .cart-item-actions .remove-btn {
      background: transparent;
      color: #999;
      font-size: 0.9rem;
      width: auto;
      padding: 0.2rem 0.6rem;
      border-radius: 30px;
    }

    .cart-item-actions .remove-btn:hover {
      background: #fee2e2;
      color: #dc2626;
    }

    /* ----- SUMMARY ----- */
    .cart-summary {
      margin-top: 1.8rem;
      text-align: right;
      padding: 1.2rem 1.5rem;
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(232, 122, 45, 0.06);
    }

    .cart-summary p {
      font-size: 1.1rem;
      margin: 0.2rem 0;
    }

    .cart-summary strong {
      font-size: 1.4rem;
      color: var(--orange-dark);
    }

    .checkout-btn {
      display: block;
      width: 100%;
      max-width: 320px;
      margin: 1.5rem auto 0;
      padding: 0.9rem 2rem;
      background: linear-gradient(135deg, var(--orange), var(--orange-dark));
      color: white;
      border: none;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 15px rgba(232, 122, 45, 0.3);
    }

    .checkout-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(232, 122, 45, 0.4);
    }

    .checkout-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* ----- FOOTER ----- */
    footer {
      margin-top: 2.5rem;
      padding: 1.8rem 0 0.8rem;
      border-top: 2px solid var(--cream-dark);
      text-align: center;
      font-size: 0.9rem;
      color: #4a3f38;
      letter-spacing: 0.02em;
    }

    footer p {
      background: var(--cream);
      display: inline-block;
      padding: 0.2rem 2rem;
      border-radius: 60px;
    }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 820px) {
      .container {
        padding: 0.8rem 1rem;
      }
      header {
        flex-direction: column;
        align-items: stretch;
        gap: 0.8rem;
      }
      .logo {
        text-align: center;
      }
      .logo img {
        height: 70px;
        margin: 0 auto;
      }
      .main-nav ul {
        justify-content: center;
        gap: 0.2rem 0.6rem;
      }
      .main-nav a {
        font-size: 0.8rem;
        padding: 0.3rem 0.7rem;
      }
      .header-icons {
        justify-content: center;
        font-size: 1.8rem;
        gap: 2rem;
      }
      .cart-item {
        flex-wrap: wrap;
        gap: 0.8rem;
      }
      .cart-item img {
        width: 60px;
        height: 60px;
      }
      .cart-item-actions {
        width: 100%;
        justify-content: flex-start;
      }
      .cart-summary {
        text-align: center;
      }
      .checkout-btn {
        max-width: 100%;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 0.4rem;
      }
      .container {
        padding: 0.4rem 0.6rem;
      }
      .main-nav ul {
        gap: 0.15rem 0.3rem;
      }
      .main-nav a {
        font-size: 0.7rem;
        padding: 0.2rem 0.5rem;
      }
      .cart-title {
        font-size: 1.8rem;
      }
      .cart-container {
        padding: 0.8rem;
      }
      .cart-item {
        padding: 0.6rem 0;
      }
      .cart-item img {
        width: 50px;
        height: 50px;
      }
      .cart-item-info h4 {
        font-size: 0.8rem;
      }
      .header-icons {
        font-size: 1.4rem;
        gap: 1.2rem;
      }
      .logo img {
        height: 55px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <header>
    <div class="logo">
      <a href="{{ url_for('user.homepage') }}">
        <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Star's Bakery Logo">
      </a>
    </div>

    <nav class="main-nav">
      <ul>
        <li><a href="{{ url_for('user.homepage') }}">Home</a></li>
        <li><a href="{{ url_for('user.muffins') }}">Muffins</a></li>
        <li><a href="{{ url_for('user.doughnuts') }}">Doughnuts</a></li>
        <li><a href="{{ url_for('user.pancakes') }}">Pancakes</a></li>
        <li><a href="{{ url_for('user.cinnamonroll') }}">Cinnamon Rolls</a></li>
        <li><a href="{{ url_for('user.cookies') }}">Cookies</a></li>
        <li><a href="{{ url_for('user.tincakes') }}">Tin Cakes</a></li>
        <li><a href="{{ url_for('user.fruitjuices') }}">Fruit Juices</a></li>
        <li><a href="{{ url_for('user.packages') }}">Packages</a></li>
        <li><a href="{{ url_for('user.aboutme') }}">About Me</a></li>
      </ul>
    </nav>

    <div class="header-icons">
      <a href="{{ url_for('user.cart') }}" class="cart">
        <i class="fas fa-shopping-bag"></i>
        <span id="cart-count">0</span>
      </a>
      <span id="profileIcon"><i class="fas fa-user-circle"></i></span>
    </div>
  </header>

  <!-- CART PAGE -->
  <main class="cart-page">
    <h1 class="cart-title"><i class="fas fa-shopping-bag" style="color:var(--orange);margin-right:10px;"></i> Shopping Cart</h1>

    <div class="cart-container" id="cart-container">
      <!-- Cart items rendered by JS -->
    </div>

    <div class="cart-summary">
      <p>Subtotal: GHS <span id="subtotal">0.00</span></p>
      <p><strong>Total: GHS <span id="total">0.00</span></strong></p>
    </div>

    <button class="checkout-btn" id="checkoutBtn" onclick="proceedCheckout()">
      <i class="fas fa-credit-card"></i> Proceed to Checkout
    </button>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 Star's Bakery. All Rights Reserved.</p>
  </footer>

</div>

<script>
  // ----- CART FUNCTIONS -----

  function getCart() {
    try {
      return JSON.parse(localStorage.getItem('cart')) || [];
    } catch {
      return [];
    }
  }

  function saveCart(cart) {
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartBadge();
  }

  function updateCartBadge() {
    const cart = getCart();
    const count = cart.reduce((sum, item) => sum + (item.quantity || 0), 0);
    const badge = document.getElementById('cart-count');
    if (badge) badge.textContent = count;
  }

  // ----- RENDER CART -----
  function renderCart() {
    const container = document.getElementById('cart-container');
    const cart = getCart();

    if (!container) return;

    if (cart.length === 0) {
      container.innerHTML = `
        <div class="cart-empty">
          <i class="fas fa-shopping-bag"></i>
          <h3>Your cart is empty</h3>
          <p>Looks like you haven't added any goodies yet.</p>
          <a href="{{ url_for('user.homepage') }}" class="shop-link">Start Shopping</a>
        </div>
      `;
      document.getElementById('subtotal').textContent = '0.00';
      document.getElementById('total').textContent = '0.00';
      document.getElementById('checkoutBtn').disabled = true;
      return;
    }

    let subtotal = 0;

    container.innerHTML = cart.map((item, index) => {
      const price = item.price || 0;
      const qty = item.quantity || 1;
      const itemTotal = price * qty;
      subtotal += itemTotal;

      return `
        <div class="cart-item" data-index="${index}">
          <img src="${item.image || '{{ url_for('static', filename='images/logo.jpg') }}'}" alt="${item.name}" onerror="this.src='{{ url_for('static', filename='images/logo.jpg') }}'" />
          <div class="cart-item-info">
            <h4>${item.name}</h4>
            <div class="item-price">GHS ${price.toFixed(2)} each</div>
          </div>
          <div class="cart-item-actions">
            <button onclick="updateQuantity(${index}, -1)"><i class="fas fa-minus"></i></button>
            <span class="qty">${qty}</span>
            <button onclick="updateQuantity(${index}, 1)"><i class="fas fa-plus"></i></button>
            <button class="remove-btn" onclick="removeItem(${index})"><i class="fas fa-trash-alt"></i></button>
          </div>
        </div>
      `;
    }).join('');

    document.getElementById('subtotal').textContent = subtotal.toFixed(2);
    document.getElementById('total').textContent = subtotal.toFixed(2);
    document.getElementById('checkoutBtn').disabled = false;
  }

  // ----- UPDATE QUANTITY -----
  function updateQuantity(index, delta) {
    const cart = getCart();
    if (!cart[index]) return;
    cart[index].quantity = Math.max(1, (cart[index].quantity || 1) + delta);
    saveCart(cart);
    renderCart();
  }

  // ----- REMOVE ITEM -----
  function removeItem(index) {
    const cart = getCart();
    cart.splice(index, 1);
    saveCart(cart);
    renderCart();
  }

  // ----- CHECKOUT -----
  function proceedCheckout() {
    const cart = getCart();
    if (cart.length === 0) {
      alert('Your cart is empty!');
      return;
    }
    localStorage.setItem('cart', JSON.stringify(cart));
    window.location.href = "{{ url_for('user.checkout') }}";
  }

  // ----- PROFILE ICON -----
  document.getElementById('profileIcon')?.addEventListener('click', function() {
    alert('👤 Profile — signed in as guest');
  });

  // ----- INITIAL RENDER -----
  renderCart();
  updateCartBadge();

  // Re-render when page comes into focus (in case of back/forward)
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      renderCart();
      updateCartBadge();
    }
  });
</script>

</body>
</html>
